<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victory Bender Roads</title>
    <!-- Force a direct link to the stylesheet -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="instrument-wrap">
        <div class="chassis">
            <header>
                <div class="logo">VICTORY</div>
                <div class="model-name">BENDER ROADS</div>
            </header>

            <div class="controls-row">
                <div class="control-group">
                    <div class="knob"></div>
                    <label>BARK</label>
                </div>
                <div class="control-group">
                    <div class="knob"></div>
                    <label>BENDER</label>
                </div>
                <div class="indicator-group">
                    <div class="gold-led" id="tremolo-led"></div>
                    <label>PULSE</label>
                </div>
                <div class="control-group">
                    <div class="knob"></div>
                    <label>SPEED</label>
                </div>
                <div class="control-group">
                    <div class="knob"></div>
                    <label>MECHANICALS</label>
                </div>
            </div>

            <div class="keybed" id="piano-keys">
                <!-- Keys are generated by engine.js -->
            </div>
        </div>
    </div>
    <script src="engine.js"></script>
    <script src="midi.js"></script>
</body>
</html>
