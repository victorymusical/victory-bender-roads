<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victory Bender Roads | Electromechanical Modeler</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="plugin-container">
        <!-- The Brushed Metal Chassis -->
        <div class="chassis">
            <header>
                <div class="logo">VICTORY</div>
                <div class="medallion"></div> <!-- Golden Bear Head Here -->
                <div class="model-name">BENDER ROADS</div>
            </header>

            <div class="controls-row">
                <!-- Tone Controls -->
                <div class="control-group">
                    <div class="knob" id="bark-knob"></div>
                    <label>BARK</label>
                </div>
                <div class="control-group">
                    <div class="knob" id="bender-knob"></div>
                    <label>BENDER</label>
                </div>
                
                <!-- The Heartbeat -->
                <div class="indicator-group">
                    <div class="gold-led" id="tremolo-led"></div>
                    <label>PULSE</label>
                </div>

                <!-- Tremolo & Mechanicals -->
                <div class="control-group">
                    <div class="knob" id="speed-knob"></div>
                    <label>SPEED</label>
                </div>
                <div class="control-group">
                    <div class="knob" id="mech-knob"></div>
                    <label>MECHANICALS</label>
                </div>
            </div>
        </div>
    </div>
    <script src="engine.js"></script>
    <script src="midi.js"></script>
</body>
</html>
