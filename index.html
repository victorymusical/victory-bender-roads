<div class="instrument-wrap">
    <div class="chassis">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victory Bender Roads</title>
    <!-- This line must match your filename exactly -->
    <link rel="stylesheet" href="styles.css">
</head>

        <div class="controls-row">
            <div class="control-group">
                <div class="knob" id="bark-knob"></div>
                <label>BARK</label>
            </div>
            <div class="control-group">
                <div class="knob" id="bender-knob"></div>
                <label>BENDER</label>
            </div>
            <div class="indicator-group">
                <div class="gold-led" id="tremolo-led"></div>
                <label>PULSE</label>
            </div>
            <div class="control-group">
                <div class="knob" id="speed-knob"></div>
                <label>SPEED</label>
            </div>
            <div class="control-group">
                <div class="knob" id="mech-knob"></div>
                <label>MECHANICALS</label>
            </div>
        </div>

        <!-- The Integrated Keybed -->
        <div class="keybed" id="piano-keys">
            <!-- Keys will be generated by JavaScript for performance -->
        </div>
    </div>
</div>
